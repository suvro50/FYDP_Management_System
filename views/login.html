<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FYDP Management System</title>
  <meta name="description" content="FYDP Management & Matchmaking System - UIU Login">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Scoped Login Page Styles (no global zoom dependency) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1453 0%, #1a237e 35%, #1565c0 70%, #0d47a1 100%);
      position: relative;
      overflow: hidden;
      padding: 20px 16px;
    }

    /* Ambient glow orbs */
    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(21,101,192,0.35) 0%, transparent 70%);
      top: -180px;
      right: -150px;
      border-radius: 50%;
      animation: pulse-glow 4s ease-in-out infinite;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(46,125,50,0.18) 0%, transparent 70%);
      bottom: -100px;
      left: -80px;
      border-radius: 50%;
      animation: pulse-glow 5s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    /* ── Login Card ── */
    .login-card {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 360px;
      padding: 28px 30px 24px;
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo Section ── */
    .login-logo {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #1a237e, #1565c0);
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(26,35,126,0.3);
    }

    .login-logo h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1a237e;
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }

    .login-logo p {
      font-size: 0.78rem;
      font-weight: 500;
      color: #1565c0;
      opacity: 0.85;
    }

    /* ── Error Box ── */
    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      color: #b71c1c;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shake 0.4s ease-in-out;
    }
    .login-error.show { display: flex; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-5px); }
      40%, 80%  { transform: translateX(5px); }
    }

    /* ── Form ── */
    .login-form { margin-top: 0; }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: #757575;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 9px 12px 9px 38px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      color: #212121;
      background: #f8f9fa;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: #bdbdbd;
    }

    .input-wrapper input:focus {
      border-color: #1565c0;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(21,101,192,0.1);
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #bdbdbd;
      font-size: 13px;
      transition: color 0.2s;
      pointer-events: none;
    }

    .input-wrapper input:focus ~ .input-icon {
      color: #1565c0;
    }

    /* ── Sign In Button ── */
    .btn-signin {
      width: 100%;
      padding: 10px 20px;
      background: linear-gradient(135deg, #1a237e, #1565c0);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(26,35,126,0.28);
      margin-top: 4px;
    }

    .btn-signin:hover {
      box-shadow: 0 6px 22px rgba(26,35,126,0.42);
      transform: translateY(-1px);
    }

    .btn-signin:active {
      transform: scale(0.98);
    }

    .btn-signin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Demo Accounts Section ── */
    .demo-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eeeeee;
    }

    .demo-label {
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: #9e9e9e;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 8px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .demo-btn {
      padding: 7px 10px;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      background: #f8f9fa;
      cursor: pointer;
      font-size: 0.72rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #424242;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .demo-btn:hover {
      border-color: #1565c0;
      background: #e3f2fd;
      color: #1565c0;
      box-shadow: 0 2px 6px rgba(21,101,192,0.12);
    }

    /* ── Toast ── */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #323232;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      z-index: 9999;
      display: flex;
      gap: 9px;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      animation: toastIn 0.35s ease-out;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h1>FYDP Management System</h1>
      <p>United International University</p>
    </div>

    <!-- Error -->
    <div class="login-error" id="loginError">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorText"></span>
    </div>

    <!-- Form -->
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email"
                 placeholder="Enter your UIU email" required autocomplete="email">
          <i class="fas fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password"
                 placeholder="Enter your password" required autocomplete="current-password">
          <i class="fas fa-lock input-icon"></i>
        </div>
      </div>

      <button type="submit" class="btn-signin" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i>
        Sign In
      </button>
    </form>

    <!-- Demo Accounts -->
    <div class="demo-section">
      <p class="demo-label">Demo Accounts</p>
      <div class="demo-grid">
        <button class="demo-btn" onclick="fillDemo('admin@uiu.ac.bd','admin123')">
          🛡️ Admin
        </button>
        <button class="demo-btn" onclick="fillDemo('tanvir@uiu.ac.bd','sup123')">
          👨‍🏫 Supervisor
        </button>
        <button class="demo-btn" onclick="fillDemo('shafiq@uiu.ac.bd','ct123')">
          🏫 Course Teacher
        </button>
        <button class="demo-btn" onclick="fillDemo('arif@student.uiu.ac.bd','stu123')">
          👨‍🎓 FYDP-Student
        </button>
        <button class="demo-btn" onclick="fillDemo('suvrojit@student.uiu.ac.bd','pre123')">
          🎯 Pre-FYDP Student
        </button>
      </div>
    </div>
  </div>

  <script>
    sessionStorage.setItem('tab_initialized', 'true');

    async function apiFetch(url, options = {}) {
      const config = { headers: {'Content-Type': 'application/json'}, credentials: 'same-origin', ...options };
      if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData))
        config.body = JSON.stringify(options.body);
      const res = await fetch(url, config);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      return data;
    }

    function showToast(msg, type = 'info') {
      const icons = { success: '✅', error: '❌', info: 'ℹ️' };
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<span>${icons[type] || ''}</span><span>${msg}</span>`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function fillDemo(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      hideError();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showError('Please enter both email and password'); return; }
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      hideError();
      try {
        const data = await apiFetch('/auth/login', { method: 'POST', body: { email, password } });
        if (data.success) {
          showToast(`Welcome, ${data.user.full_name}!`, 'success');
          setTimeout(() => { window.location.href = data.redirect; }, 400);
        }
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });

    function showError(msg) {
      const el = document.getElementById('loginError');
      document.getElementById('errorText').textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('loginError').classList.remove('show');
    }
  </script>
</body>
</html>
